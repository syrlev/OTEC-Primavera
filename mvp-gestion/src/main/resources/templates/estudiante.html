<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Estudiante - OTEC Primavera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css?v=3}">
</head>
<body>
    <nav class="navbar navbar-dark mb-4" style="background: linear-gradient(to bottom, #005bb7 0%, #004494 100%); border-bottom: 1px solid rgba(255,255,255,0.4);">
        <div class="container">
            <span class="navbar-brand mb-0 h1" style="text-shadow: 1px 1px 2px #000;">OTEC Primavera - Estudiante</span>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="aero-card p-4 mb-4">
            <h3 class="mb-4" style="color: #003366; text-shadow: 1px 1px 0px #fff;">Mis Cursos y Progreso</h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Curso</th>
                            <th>Estado</th>
                            <th>Avance (%)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="matricula : ${matriculas}">
                            <td th:text="${matricula.curso.nombre}"></td>
                            <td th:text="${matricula.estado}"></td>
                            <td th:text="${matricula.avancePorcentaje} + '%'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
