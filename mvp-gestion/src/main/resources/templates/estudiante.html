<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Estudiante - OTEC Primavera</title>
     <link href="https://bootswatch.com/5/sandstone/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">OTEC Primavera - Estudiante</a>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm p-4 mb-4 border-0">
            <h3 class="text-primary mb-4 fw-bold">Mis Cursos y Progreso</h3>
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre del Curso</th>
                            <th>Estado Actual</th>
                            <th class="text-center">Porcentaje de Avance</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="matricula : ${matriculas}">
                            <td class="fw-bold" th:text="${matricula.curso.nombre}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${matricula.estado}"></span>
                            </td>
                            <td class="text-center">
                                <span class="h5 text-primary fw-bold" 
                                      th:text="${matricula.avancePorcentaje} + '%'">0%</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
