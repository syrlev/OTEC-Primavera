<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - OTEC Primavera</title>
  <link href="https://bootswatch.com/5/sandstone/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4 w-100" style="max-width: 400px; border-radius: 10px;">
        <h2 class="text-center text-primary mb-4 fw-bold">Iniciar Sesión</h2>
        
        <div th:if="${param.error}" class="alert alert-danger py-2 small shadow-sm">
            Usuario o contraseña incorrectos.
        </div>
        
        <div th:if="${param.logout}" class="alert alert-info py-2 small shadow-sm">
            Has cerrado sesión correctamente.
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Nombre de usuario" required autofocus />
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Entrar al Sistema</button>
        </form>
        
        <div class="text-center mt-4">
            <a th:href="@{/}" class="text-decoration-none small text-muted">← Volver al inicio</a>
        </div>
    </div>

</body>
</html>
