<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - OTEC Primavera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css?v=3}">
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="aero-card p-5 w-100" style="max-width: 400px;">
        <h2 class="text-center mb-4" style="color: #003366; text-shadow: 1px 1px 1px #fff; font-weight: bold;">Iniciar Sesión</h2>
        
        <div th:if="${param.error}" class="alert alert-danger" style="background: rgba(255, 200, 200, 0.5); border-radius: 8px; border: 1px solid rgba(255,0,0,0.3);">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" style="background: rgba(200, 255, 200, 0.5); border-radius: 8px; border: 1px solid rgba(0,255,0,0.3);">
            Has cerrado sesión correctamente.
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label" style="font-weight: 500; color: #003366;">Usuario:</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus />
            </div>
            <div class="mb-4">
                <label for="password" class="form-label" style="font-weight: 500; color: #003366;">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-glossy-blue w-100 py-2">Entrar</button>
        </form>
    </div>
</body>
</html>
