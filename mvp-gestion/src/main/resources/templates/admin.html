<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - OTEC Primavera</title>
<link href="https://bootswatch.com/5/sandstone/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand h1 mb-0">OTEC Primavera - Admin</span>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4 h-100">
                    <h4 class="text-primary mb-3">Crear Nuevo Curso</h4>
                    <form th:action="@{/admin/cursos/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Curso:</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Java Básico" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción:</label>
                            <textarea name="descripcion" class="form-control" rows="2" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar Curso</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4 h-100">
                    <h4 class="text-info mb-3">Matricular Alumno</h4>
                    <form th:action="@{/admin/matriculas/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Seleccionar Estudiante:</label>
                            <select name="estudianteId" class="form-select" required>
                                <option value="">Seleccione un alumno...</option>
                                <option th:each="estudiante : ${estudiantes}" th:value="${estudiante.id}" th:text="${estudiante.username}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Seleccionar Curso:</label>
                            <select name="cursoId" class="form-select" required>
                                <option value="">Seleccione un curso...</option>
                                <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.nombre}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Matricular Estudiante</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h4 class="text-primary mb-3">Gestión de Cursos</h4>
            <div class="table-responsive">
                <table class="table table-hover table-bordered">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="curso : ${cursos}">
                            <td th:text="${curso.id}"></td>
                            <td th:text="${curso.nombre}"></td>
                            <td th:text="${curso.descripcion}"></td>
                            <td>
                                <form th:action="@{/admin/cursos/eliminar}" method="post">
                                    <input type="hidden" name="cursoId" th:value="${curso.id}" />
                                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h4 class="text-info mb-3">Alumnos Inscritos por Curso</h4>
            <div class="table-responsive">
                <table class="table table-hover table-bordered">
                    <thead class="table-info">
                        <tr>
                            <th>Curso</th>
                            <th>Estudiante</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="matricula : ${todasLasMatriculas}">
                            <td th:text="${matricula.curso.nombre}"></td>
                            <td th:text="${matricula.estudiante.username}"></td>
                            <td th:text="${matricula.estado}"></td>
                            <td>
                                <form th:action="@{/admin/matriculas/eliminar}" method="post">
                                    <input type="hidden" name="matriculaId" th:value="${matricula.id}" />
                                    <button type="submit" class="btn btn-warning btn-sm">Quitar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
