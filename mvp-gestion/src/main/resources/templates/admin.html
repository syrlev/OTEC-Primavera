<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - OTEC Primavera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css?v=3}">
</head>
<body>
    <nav class="navbar navbar-dark mb-4" style="background: linear-gradient(to bottom, #005bb7 0%, #004494 100%); border-bottom: 1px solid rgba(255,255,255,0.4);">
        <div class="container">
            <span class="navbar-brand mb-0 h1" style="text-shadow: 1px 1px 2px #000;">OTEC Primavera - Admin</span>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="aero-card p-4 h-100">
                    <h4 class="mb-3" style="color: #003366; text-shadow: 1px 1px 0px #fff;">Crear Nuevo Curso</h4>
                    <form th:action="@{/admin/cursos/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 500;">Nombre del Curso:</label>
                            <input type="text" name="nombre" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 500;">Descripción:</label>
                            <input type="text" name="descripcion" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-glossy w-100">Guardar Curso</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="aero-card p-4 h-100">
                    <h4 class="mb-3" style="color: #003366; text-shadow: 1px 1px 0px #fff;">Matricular Alumno en Curso</h4>
                    <form th:action="@{/admin/matriculas/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 500;">Seleccionar Estudiante:</label>
                            <select name="estudianteId" class="form-select" required>
                                <option value="">Seleccione un alumno...</option>
                                <option th:each="estudiante : ${estudiantes}" th:value="${estudiante.id}" th:text="${estudiante.username}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 500;">Seleccionar Curso:</label>
                            <select name="cursoId" class="form-select" required>
                                <option value="">Seleccione un curso...</option>
                                <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.nombre}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-glossy-blue w-100">Matricular</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="aero-card p-4 mb-4">
            <h4 class="mb-3" style="color: #003366; text-shadow: 1px 1px 0px #fff;">Gestión de Cursos</h4>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="curso : ${cursos}">
                            <td th:text="${curso.id}"></td>
                            <td th:text="${curso.nombre}"></td>
                            <td th:text="${curso.descripcion}"></td>
                            <td>
                                <form th:action="@{/admin/cursos/eliminar}" method="post" class="d-inline">
                                    <input type="hidden" name="cursoId" th:value="${curso.id}" />
                                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="aero-card p-4 mb-4">
            <h4 class="mb-3" style="color: #003366; text-shadow: 1px 1px 0px #fff;">Alumnos Inscritos por Curso</h4>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Curso</th>
                            <th>Estudiante</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="matricula : ${todasLasMatriculas}">
                            <td th:text="${matricula.curso.nombre}"></td>
                            <td th:text="${matricula.estudiante.username}"></td>
                            <td th:text="${matricula.estado}"></td>
                            <td>
                                <form th:action="@{/admin/matriculas/eliminar}" method="post" class="d-inline">
                                    <input type="hidden" name="matriculaId" th:value="${matricula.id}" />
                                    <button type="submit" class="btn btn-warning btn-sm">Quitar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
